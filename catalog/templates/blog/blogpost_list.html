<!--список статей-->

{% extends 'catalog/base.html' %}

{% block title %}Блог{% endblock %}

{% block content %}
<div class="d-flex justify-content-end mb-3">
    <a href="{% url 'blog:create' %}" class="btn btn-primary">Создать статью</a>
</div>

<div class="row justify-content">
    <div class="col-md-4">
        {% for post in posts %}
        <div class="card mb-3 shadow-sm border-0" style="border-radius: 8px;">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ post.title }}</h5>
                <p class="card-text text-muted" style="font-size: 14px; line-height: 1.5;">{{ post.content|truncatechars:200 }}</p>
                <a href="{% url 'blog:detail' post.pk %}" class="btn btn-outline-primary btn-sm">Читать далее</a>
            </div>
        </div>
        {% empty %}
        <p class="text-muted">Статей пока нет.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
