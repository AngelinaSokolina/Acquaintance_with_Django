{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0" style="border-radius: 8px;">
            <div class="card-body text-center">
                <h4 class="card-title fw-bold mb-4">Удаление товара</h4>
                <p class="mb-4">Вы уверены, что хотите удалить товар <strong>"{{ object.name }}"</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger px-4">Удалить</button>
                        <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary px-4">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
